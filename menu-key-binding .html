<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réglage de la touche du menu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --panel: #0d0e17;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f2f2f7;
    --text-dim: #8a8ca3;
    --accent: #58c4ff;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel {
    width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  }

  .row-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 2px solid var(--accent);
  }

  .row-header .icon {
    font-size: 15px;
    color: var(--text-dim);
    opacity: 0.8;
  }

  .row-header .sep {
    width: 1px;
    height: 16px;
    background: var(--border);
  }

  .row-header .label {
    font-size: 14px;
    font-weight: 600;
  }

  .key-row {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--text);
  }

  .key-row .cursor {
    display: inline-block;
    width: 1px;
    margin-left: 3px;
    color: var(--accent);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="row-header">
      <span class="icon">⌨</span>
      <span class="sep"></span>
      <span class="label">Choisir la touche du menu</span>
    </div>
    <div class="key-row">
      <span id="keyValue">F6</span><span class="cursor">|</span>
    </div>
  </div>

<script>
  const keyValue = document.getElementById('keyValue');

  // Ce qu'on affiche ici est purement visuel. Quand tu branches ça sur
  // ton menu FiveM, sauvegarde `currentKey` à chaque changement (ex:
  // callback NUI vers ton client Lua) pour un RegisterKeyMapping
  // dynamique avec cette touche.
  let currentKey = 'F6';

  const KEY_LABELS = {
    ' ': 'Espace', 'Escape': 'Échap', 'Delete': 'Suppr', 'Backspace': 'Retour',
    'Enter': 'Entrée', 'ArrowUp': '↑', 'ArrowDown': '↓', 'ArrowLeft': '←', 'ArrowRight': '→',
  };

  function labelFor(key) {
    return KEY_LABELS[key] || (key.length === 1 ? key.toUpperCase() : key);
  }

  // Aucune étape de validation : chaque touche pressée remplace
  // immédiatement la précédente, sans limite de nombre de fois.
  document.addEventListener('keydown', (e) => {
    e.preventDefault();
    currentKey = e.key;
    keyValue.textContent = labelFor(currentKey);
  });
</script>
</body>
</html>
